<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پادکست کافه سلامت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-2xl space-y-6">
        
        <!-- هدر سایت -->
        <div class="bg-gray-900/85 backdrop-blur-md border border-gray-800 rounded-2xl p-6 shadow-2xl text-center relative">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent mb-2">
                🎙️ پادکست کافه سلامت
            </h1>
            <p class="text-xs text-gray-400">مجموعه جلسات و مباحث تخصصی</p>
            
            <a href="admin1366.html" class="absolute top-4 left-4 text-xs text-gray-500 hover:text-indigo-400 transition-colors">
                ⚙️ ادمین
            </a>
        </div>

        <!-- لیست جلسات -->
        <div id="sessionsContainer" class="space-y-4">
            <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-6 text-center text-gray-500 text-sm">
                در حال بارگذاری جلسات...
            </div>
        </div>

    </div>

    <script>
        const owner = "misaghshiralix-ctrl";
        const repo = "soot-jalasat";
        const filePath = "sessions.json";

        async function loadPublicSessions() {
            const container = document.getElementById("sessionsContainer");
            try {
                // خواندن مستقیم از گیت‌هاب (یا فایل خام)
                const url = `https://raw.githubusercontent.com/${owner}/${repo}/main/${filePath}?t=${Date.now()}`;
                const res = await fetch(url);
                
                if (!res.ok) throw new Error("فایل جلسات یافت نشد.");

                const sessions = await res.json();

                if (!sessions || sessions.length === 0) {
                    container.innerHTML = `
                        <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-6 text-center text-gray-400 text-sm">
                            هنوز جلسه‌ای منتشر نشده است.
                        </div>`;
                    return;
                }

                container.innerHTML = "";
                // نمایش از جدیدترین به قدیمی‌ترین
                sessions.slice().reverse().forEach((session) => {
                    container.innerHTML += `
                        <div class="bg-gray-900/80 backdrop-blur-md border border-gray-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
                            <div class="flex justify-between items-center">
                                <h2 class="text-sm font-semibold text-gray-200">${session.title}</h2>
                                <span class="text-[10px] text-gray-500">${new Date(session.date).toLocaleDateString('fa-IR')}</span>
                            </div>
                            
                            <audio controls class="w-full h-10 accent-indigo-500">
                                <source src="${session.url}" type="audio/mpeg">
                                مرورگر شما از پخش صوت پشتیبانی نمی‌کند.
                            </audio>

                            <div class="flex justify-end">
                                <a href="${session.url}" download class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 transition-colors bg-indigo-500/10 px-3 py-1.5 rounded-lg">
                                    📥 دانلود صوت
                                </a>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                container.innerHTML = `
                    <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-6 text-center text-red-400 text-sm">
                        خطا در بارگذاری جلسات سایت.
                    </div>`;
            }
        }

        window.onload = loadPublicSessions;
    </script>
</body>
</html>
