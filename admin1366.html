<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت کافه سلامت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-900/80 backdrop-blur-md border border-gray-800 rounded-2xl p-6 w-full max-w-lg shadow-2xl relative">
        
        <!-- هدر پنل -->
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-800">
            <h1 class="text-lg font-bold flex items-center gap-2">
                <span>🛡️</span> پنل مدیریت کافه سلامت
            </h1>
            <a href="index.html" class="text-sm text-indigo-400 hover:text-indigo-300 flex items-center gap-1 transition-colors">
                <span>مشاهده سایت</span> ⬅
            </a>
        </div>

        <!-- فرم آپلود صوت جدید -->
        <div class="bg-gray-950/50 border border-gray-800/80 rounded-xl p-5 mb-6">
            <h2 class="text-sm font-semibold text-indigo-400 mb-4 flex items-center gap-2">
                <span>➕</span> آپلود صوت جدید از کامپیوتر
            </h2>

            <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5">عنوان جلسه</label>
                    <input type="text" id="sessionTitle" required 
                        placeholder="مثال: جلسه اول - مقدمه" 
                        class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition-colors">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1.5">انتخاب فایل صوتی (MP3)</label>
                    <input type="file" id="audioFile" accept="audio/mp3,audio/*" required
                        class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 file:cursor-pointer cursor-pointer bg-gray-900 border border-gray-800 rounded-lg">
                </div>

                <button type="submit" id="submitBtn" 
                    class="w-full py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium text-sm rounded-xl transition-all shadow-lg shadow-indigo-600/20">
                    آپلود و انتشار در سایت
                </button>
            </form>
        </div>

        <!-- بخش وضعیت و مدیریت -->
        <div class="border-t border-gray-800/80 pt-4 text-center">
            <p id="statusMessage" class="text-xs text-gray-400"></p>
        </div>

    </div>

    <script>
        const owner = "misaghshiralix-ctrl";
        const repo = "soot-jalasat";
        const filePath = "sessions.json";

        // مدیریت توکن امن در مرورگر برای جلوگیری از لو رفتن در گیت‌هاب
        function getGitHubToken() {
            let token = localStorage.getItem("github_token");
            if (!token) {
                token = prompt("لطفاً توکن دسترسی گیت‌هاب (Personal Access Token) خود را وارد کنید:");
                if (token) {
                    localStorage.setItem("github_token", token.trim());
                }
            }
            return localStorage.getItem("github_token");
        }

        // تابع ارتباط با گیت‌هاب
        async function callGitHubAPI(url, method = "GET", bodyData = null) {
            const token = getGitHubToken();
            if (!token) throw new Error("توکن گیت‌هاب وارد نشده است.");

            const headers = {
                "Authorization": `token ${token}`,
                "Accept": "application/vnd.github.v3+json",
                "Content-Type": "application/json"
            };

            const options = { method, headers };
            if (bodyData) options.body = JSON.stringify(bodyData);

            const response = await fetch(url, options);
            if (response.status === 401) {
                localStorage.removeItem("github_token");
                throw new Error("توکن گیت‌هاب نامعتبر یا منقضی شده است (401). لطفاً صفحه را رفرش کنید.");
            }
            return response;
        }

        // عملیات آپلود فایل و ثبت در sessions.json
        async function handleUpload(event) {
            event.preventDefault();
            const titleInput = document.getElementById("sessionTitle").value;
            const fileInput = document.getElementById("audioFile").files[0];
            const statusMsg = document.getElementById("statusMessage");
            const submitBtn = document.getElementById("submitBtn");

            if (!fileInput) return;

            submitBtn.disabled = true;
            statusMsg.textContent = "در حال آپلود فایل صوتی و بروزرسانی گیت‌هاب...";

            try {
                // ۱. خواندن فایل‌ها از گیت‌هاب برای آپدیت لیست جلسات
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;
                let sessionsList = [];
                let fileSha = "";

                const getRes = await callGitHubAPI(apiUrl, "GET");
                if (getRes.ok) {
                    const data = await getRes.json();
                    fileSha = data.sha;
                    // دیکد کردن محتوای فعلی sessions.json
                    const decodedContent = decodeURIComponent(escape(atob(data.content)));
                    sessionsList = JSON.parse(decodedContent);
                }

                // ۲. آپلود خود فایل صوتی به مخزن (در پوشه‌ای مثل audios/)
                const audioFileName = `audios/${Date.now()}_${fileInput.name}`;
                const audioApiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${audioFileName}`;
                
                // تبدیل فایل به بیس‌کاره
                const base64Audio = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(fileInput);
                });

                const audioBody = {
                    message: `Upload audio: ${titleInput}`,
                    content: base64Audio
                };

                const audioRes = await callGitHubAPI(audioApiUrl, "PUT", audioBody);
                if (!audioRes.ok) throw new Error("خطا در آپلود فایل صوتی به گیت‌هاب.");

                const audioDataJson = await audioRes.json();
                const audioDownloadUrl = audioDataJson.content.download_url;

                // ۳. اضافه کردن مشخصات جلسه جدید به لیست
                sessionsList.push({
                    title: titleInput,
                    url: audioDownloadUrl,
                    date: new Date().toISOString()
                });

                // ۴. آپدیت کردن فایل نهایی sessions.json در گیت‌هاب
                const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(sessionsList, null, 2))));
                const updateBody = {
                    message: `Add new session: ${titleInput}`,
                    content: updatedContentBase64,
                    sha: fileSha
                };

                const updateRes = await callGitHubAPI(apiUrl, "PUT", updateBody);
                if (updateRes.ok) {
                    statusMsg.textContent = "✅ جلسه با موفقیت آپلود و در سایت منتشر شد!";
                    document.getElementById("uploadForm").reset();
                } else {
                    throw new Error("خطا در ذخیره لیست جلسات.");
                }

            } catch (error) {
                console.error(error);
                statusMsg.textContent = "❌ " + error.message;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
