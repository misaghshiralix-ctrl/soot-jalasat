<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت کافه سلامت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow { box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.25); }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-950 via-gray-900 to-indigo-950 text-gray-100 min-h-screen flex items-center justify-center p-4 md:p-8">

    <div id="admin-panel" class="w-full max-w-lg glass p-6 md:p-8 rounded-3xl glow space-y-6 hidden border-indigo-500/20">
        
        <div class="flex items-center justify-between border-b border-gray-800 pb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="text-xl font-bold">پنل مدیریت کافه سلامت</h2>
            </div>
            <a href="index.html" class="text-xs text-indigo-400 hover:underline flex items-center gap-1">
                <i class="fa-solid fa-house"></i> مشاهده سایت
            </a>
        </div>

        <div class="space-y-4 bg-gray-900/50 p-5 rounded-2xl border border-gray-800">
            <h3 class="font-semibold text-sm text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus"></i> آپلود صوت جدید از کامپیوتر
            </h3>
            <div>
                <label class="block text-xs text-gray-400 mb-1.5">عنوان جلسه</label>
                <input type="text" id="title" placeholder="مثال: جلسه اول - مقدمه" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition text-gray-200">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1.5">انتخاب فایل صوتی (MP3)</label>
                <input type="file" id="audio-file" accept="audio/*" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2 text-sm text-gray-400 file:ml-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
            </div>
            <button id="submit-btn" onclick="uploadAndAddSession()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 font-medium py-3 rounded-xl shadow-lg shadow-indigo-600/20 hover:opacity-90 transition cursor-pointer text-sm">
                آپلود و انتشار در سایت
            </button>
        </div>

        <div class="space-y-3">
            <h3 class="font-semibold text-sm text-gray-400 flex items-center gap-2">
                <i class="fa-solid fa-trash-can"></i> مدیریت و حذف فایل‌ها
            </h3>
            <div id="admin-list" class="space-y-2 max-h-56 overflow-y-auto pr-1"></div>
        </div>

    </div>

    <script>
      // === تنظیمات گیت‌هاب و فضای ابری ===
        const GITHUB_USER = "misaghshiralix-ctrl";
        const GITHUB_REPO = "soot-jalasat";
        const GITHUB_TOKEN = "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";
        const ADMIN_PASSWORD = "1366";

        // تنظیمات Cloudinary
        const CLOUD_NAME = "sfyrkwkq"; 
        const UPLOAD_PRESET = "soot-j";
        // =====================================

        let currentSessions = [];
        let fileSha = "";

        function checkAuth() {
            const enteredPass = prompt("🔐 لطفاً رمز عبور پنل ادمین را وارد کنید:");
            if (enteredPass === ADMIN_PASSWORD) {
                document.getElementById('admin-panel').classList.remove('hidden');
                fetchSessions();
            } else {
                alert("❌ رمز عبور اشتباه است!");
                window.location.href = "index.html";
            }
        }

        async function fetchSessions() {
            const container = document.getElementById('admin-list');
            container.innerHTML = "<p class='text-gray-500 text-xs text-center py-2'>در حال دریافت اطلاعات...</p>";

            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/sessions.json`, {
                    headers: { "Authorization": `token ${GITHUB_TOKEN}` }
                });
                const data = await res.json();
                fileSha = data.sha;
                currentSessions = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                renderAdminList();
            } catch (err) {
                container.innerHTML = "<p class='text-red-400 text-xs text-center'>خطا در اتصال به گیت‌هاب.</p>";
            }
        }

        async function uploadAndAddSession() {
            const title = document.getElementById('title').value.trim();
            const fileInput = document.getElementById('audio-file');
            const file = fileInput.files[0];

            if (!title || !file) {
                alert('⚠️ لطفاً هم عنوان جلسه و هم فایل صوتی را انتخاب کنید.');
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = "در حال آپلود فایل...";

            // ۱. آپلود فایل به کلودینری
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            try {
                const cloudRes = await fetch(`https://api.com/v1_1/${CLOUD_NAME}/auto/upload`, { // (یا آدرس صحیح آپلود کلودینری)
                    method: 'POST',
                    body: formData
                });
                
                // توجه: آدرس دقیق API کلودینری به شکل زیر است:
                // https://api.cloudinary.com/v1_1/ نام_شما /upload
                
            } catch (e) {
                // ... ادامه منطق آپلود و ثبت در گیت‌هاب
            }
        }
        
        // بقیه متدها برای ثبت در گیت‌هاب...
        checkAuth();
    </script>
</body>
</html>
