<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; color: #f3f4f6; }</style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center">

    <!-- صفحه ورود -->
    <div id="loginScreen" class="w-full max-w-md bg-gray-900/90 border border-gray-800 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-xl font-bold text-center mb-6">پنل مدیریت</h1>
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <input type="password" id="passInput" placeholder="رمز عبور" required class="w-full bg-black border border-gray-800 rounded-lg p-3 text-sm focus:border-indigo-500 outline-none">
            <input type="password" id="tokenInput" placeholder="توکن گیت‌هاب (فقط بار اول)" class="w-full bg-black border border-gray-800 rounded-lg p-3 text-sm focus:border-indigo-500 outline-none hidden">
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold transition-all">ورود</button>
        </form>
    </div>

    <!-- پنل ادمین -->
    <div id="adminPanel" class="w-full max-w-2xl space-y-6 hidden">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 flex justify-between items-center">
            <h1 class="font-bold">مدیریت جلسات</h1>
            <button onclick="location.reload()" class="text-xs text-gray-500 hover:text-gray-300">خروج</button>
        </div>
        
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
            <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-4">
                <input type="text" id="sessionTitle" placeholder="عنوان جلسه" required class="w-full bg-black border border-gray-800 rounded-lg p-3 text-sm outline-none">
                <input type="file" id="audioFile" accept="audio/*" required class="w-full text-sm text-gray-400 file:bg-gray-800 file:border-0 file:px-4 file:py-2 file:rounded-lg">
                <button type="submit" id="submitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold transition-all">آپلود و انتشار</button>
            </form>
            <p id="status" class="text-xs text-center mt-4 text-gray-400"></p>
        </div>
    </div>

    <script>
        const owner = "misaghshiralix-ctrl";
        const repo = "soot-jalasat";
        const filePath = "sessions.json";
        const PASS = "1366";

        window.onload = () => {
            if (!localStorage.getItem("github_token")) {
                document.getElementById("tokenInput").classList.remove("hidden");
                document.getElementById("tokenInput").required = true;
            }
        };

        function handleLogin(event) {
            event.preventDefault();
            if (document.getElementById("passInput").value !== PASS) {
                alert("رمز اشتباه است");
                return;
            }
            
            const tokenInput = document.getElementById("tokenInput");
            if (tokenInput.value.trim() !== "") {
                localStorage.setItem("github_token", tokenInput.value.trim());
            }
            
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("adminPanel").classList.remove("hidden");
        }

        async function handleUpload(event) {
            event.preventDefault();
            const title = document.getElementById("sessionTitle").value;
            const file = document.getElementById("audioFile").files[0];
            const btn = document.getElementById("submitBtn");
            const status = document.getElementById("status");

            btn.disabled = true;
            status.textContent = "در حال بررسی فایل‌ها...";

            try {
                const token = localStorage.getItem("github_token");
                let list = [];
                let fileSha = null;

                // چک کردن وجود فایل sessions.json در گیت‌هاب
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
                    headers: { "Authorization": `token ${token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.sha;
                    if (data.content && data.content.trim() !== "") {
                        try {
                            const decoded = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
                            list = JSON.parse(decoded);
                        } catch (e) {
                            list = [];
                        }
                    }
                }

                status.textContent = "در حال آپلود فایل صوتی...";

                // 1. آپلود فایل صوتی
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const base64 = reader.result.split(',')[1];
                    const fileName = `audios/${Date.now()}_${file.name}`;
                    
                    const audioRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${fileName}`, {
                        method: "PUT",
                        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ message: "upload audio", content: base64 })
                    });
                    
                    if (!audioRes.ok) throw new Error("خطا در آپلود فایل صوتی");
                    const audioData = await audioRes.json();
                    
                    list.push({ title: title, url: audioData.content.download_url });

                    status.textContent = "در حال ثبت نهایی...";

                    // 2. ساخت یا آپدیت فایل sessions.json
                    const updateBody = {
                        message: "update sessions list",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(list, null, 2))))
                    };
                    if (fileSha) updateBody.sha = fileSha;

                    const updateRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
                        method: "PUT",
                        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                        body: JSON.stringify(updateBody)
                    });

                    if (!updateRes.ok) throw new Error("خطا در ثبت لیست جلسات");

                    status.textContent = "✅ با موفقیت منتشر شد!";
                    btn.disabled = false;
                    document.getElementById("uploadForm").reset();
                };
            } catch (err) {
                status.textContent = "❌ خطا: " + err.message;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
