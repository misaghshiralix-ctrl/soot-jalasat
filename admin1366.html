<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت کافه سلامت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

    <!-- صفحه ورود (رمز عبور + توکن گیت‌هاب) -->
    <div id="loginScreen" class="w-full max-w-md bg-gray-900/90 backdrop-blur-md border border-gray-800 rounded-2xl p-6 shadow-2xl hidden">
        <h1 class="text-lg font-bold text-center mb-2 flex items-center justify-center gap-2">
            <span>🔐</span> ورود به پنل مدیریت
        </h1>
        <p class="text-xs text-gray-400 text-center mb-6">لطفاً رمز عبور پنل و توکن گیت‌هاب خود را وارد کنید</p>
        
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1.5">رمز عبور پنل (مثلاً 1366)</label>
                <input type="password" id="panelPassword" required 
                    placeholder="رمز عبور دلخواه..." 
                    class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1.5">توکن گیت‌هاب (GitHub Token)</label>
                <input type="password" id="tokenInput" required 
                    placeholder="ghp_... یا github_pat_..." 
                    class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <button type="submit" 
                class="w-full py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium text-sm rounded-xl transition-all shadow-lg shadow-indigo-600/20">
                ورود به پنل
            </button>
        </form>
        <div class="mt-4 text-center">
            <a href="index.html" class="text-xs text-indigo-400 hover:text-indigo-300">← بازگشت به سایت اصلی</a>
        </div>
    </div>

    <!-- محتوای اصلی پنل ادمین -->
    <div id="adminPanel" class="w-full max-w-2xl space-y-6 hidden">
        
        <div class="bg-gray-900/80 backdrop-blur-md border border-gray-800 rounded-2xl p-6 shadow-2xl flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2">
                <span>🛡️</span> پنل مدیریت کافه سلامت
            </h1>
            <div class="flex items-center gap-4">
                <button onclick="logout()" class="text-xs text-red-400 hover:text-red-300 transition-colors">خروج</button>
                <a href="index.html" class="text-sm text-indigo-400 hover:text-indigo-300 flex items-center gap-1 transition-colors">
                    <span>مشاهده سایت</span> ⬅
                </a>
            </div>
        </div>

        <!-- آپلود صوت -->
        <div class="bg-gray-900/80 backdrop-blur-md border border-gray-800 rounded-2xl p-6 shadow-2xl">
            <h2 class="text-sm font-semibold text-indigo-400 mb-4 flex items-center gap-2">
                <span>➕</span> آپلود جلسه جدید
            </h2>

            <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5">عنوان جلسه</label>
                    <input type="text" id="sessionTitle" required 
                        placeholder="مثال: جلسه اول - مقدمه" 
                        class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition-colors">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1.5">انتخاب فایل صوتی (MP3)</label>
                    <input type="file" id="audioFile" accept="audio/mp3,audio/*" required
                        class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 file:cursor-pointer cursor-pointer bg-gray-950 border border-gray-800 rounded-lg">
                </div>

                <button type="submit" id="submitBtn" 
                    class="w-full py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium text-sm rounded-xl transition-all shadow-lg shadow-indigo-600/20">
                    آپلود و انتشار در سایت
                </button>
            </form>
            <p id="statusMessage" class="text-xs text-center text-gray-400 mt-4"></p>
        </div>

        <!-- مدیریت جلسات -->
        <div class="bg-gray-900/80 backdrop-blur-md border border-gray-800 rounded-2xl p-6 shadow-2xl">
            <h2 class="text-sm font-semibold text-indigo-400 mb-4 flex items-center gap-2">
                <span>🎧</span> مدیریت و حذف جلسات
            </h2>
            <div id="adminSessionsList" class="space-y-3">
                <p class="text-xs text-gray-500 text-center py-4">در حال بارگذاری...</p>
            </div>
        </div>

    </div>

    <script>
        const owner = "misaghshiralix-ctrl";
        const repo = "soot-jalasat";
        const filePath = "sessions.json";
        
        // رمز عبوری که برای ورود به پنل تعیین می‌کنید (می‌توانید تغییرش دهید)
        const MY_PANEL_PASSWORD = "1366";

        function checkAuth() {
            const isAuth = localStorage.getItem("panel_auth");
            const token = localStorage.getItem("github_token");
            
            if (isAuth !== "true" || !token) {
                document.getElementById("loginScreen").classList.remove("hidden");
                document.getElementById("adminPanel").classList.add("hidden");
            } else {
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("adminPanel").classList.remove("hidden");
                loadAdminSessions();
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const pass = document.getElementById("panelPassword").value;
            const token = document.getElementById("tokenInput").value.trim();

            if (pass !== MY_PANEL_PASSWORD) {
                alert("رمز عبور پنل اشتباه است!");
                return;
            }

            if (token) {
                localStorage.setItem("panel_auth", "true");
                localStorage.setItem("github_token", token);
                checkAuth();
            }
        }

        function logout() {
            localStorage.removeItem("panel_auth");
            localStorage.removeItem("github_token");
            checkAuth();
        }

        function getGitHubToken() {
            return localStorage.getItem("github_token");
        }

        async function callGitHubAPI(url, method = "GET", bodyData = null) {
            const token = getGitHubToken();
            if (!token) throw new Error("توکن وارد نشده است.");

            const headers = {
                "Authorization": `token ${token}`,
                "Accept": "application/vnd.github.v3+json",
                "Content-Type": "application/json"
            };

            const options = { method, headers };
            if (bodyData) options.body = JSON.stringify(bodyData);

            const response = await fetch(url, options);
            if (response.status === 401) {
                logout();
                throw new Error("توکن گیت‌هاب نامعتبر یا منقضی شده است (401).");
            }
            return response;
        }

        async function loadAdminSessions() {
            const container = document.getElementById("adminSessionsList");
            try {
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;
                const res = await callGitHubAPI(apiUrl, "GET");
                if (!res.ok) throw new Error("فایل جلسات یافت نشد.");

                const data = await res.json();
                const sessions = JSON.parse(decodeURIComponent(escape(atob(data.content))));

                if (sessions.length === 0) {
                    container.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">هیچ جلسه‌ای ثبت نشده است.</p>`;
                    return;
                }

                container.innerHTML = "";
                sessions.forEach((session, index) => {
                    container.innerHTML += `
                        <div class="bg-gray-950/60 border border-gray-800/80 rounded-xl p-4 flex flex-col gap-3">
                            <div class="flex justify-between items-center">
                                <span class="text-sm font-medium text-gray-200">${session.title}</span>
                                <button onclick="deleteSession(${index})" class="text-xs text-red-400 hover:text-red-300 bg-red-500/10 px-2.5 py-1 rounded-lg transition-colors">حذف</button>
                            </div>
                            <audio controls class="w-full h-9">
                                <source src="${session.url}" type="audio/mpeg">
                            </audio>
                        </div>
                    `;
                });
            } catch (error) {
                container.innerHTML = `<p class="text-xs text-red-400 text-center py-4">خطا: ${error.message}</p>`;
            }
        }

        async function handleUpload(event) {
            event.preventDefault();
            const titleInput = document.getElementById("sessionTitle").value;
            const fileInput = document.getElementById("audioFile").files[0];
            const statusMsg = document.getElementById("statusMessage");
            const submitBtn = document.getElementById("submitBtn");

            if (!fileInput) return;

            submitBtn.disabled = true;
            statusMsg.textContent = "در حال آپلود صوت و ثبت در گیت‌هاب...";

            try {
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;
                let sessionsList = [];
                let fileSha = "";

                const getRes = await callGitHubAPI(apiUrl, "GET");
                if (getRes.ok) {
                    const data = await getRes.json();
                    fileSha = data.sha;
                    sessionsList = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                }

                const audioFileName = `audios/${Date.now()}_${fileInput.name}`;
                const audioApiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${audioFileName}`;
                
                const base64Audio = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(fileInput);
                });

                const audioRes = await callGitHubAPI(audioApiUrl, "PUT", {
                    message: `Upload audio: ${titleInput}`,
                    content: base64Audio
                });

                if (!audioRes.ok) throw new Error("خطا در آپلود فایل صوتی.");
                const audioDataJson = await audioRes.json();

                sessionsList.push({
                    title: titleInput,
                    url: audioDataJson.content.download_url,
                    date: new Date().toISOString()
                });

                const updateRes = await callGitHubAPI(apiUrl, "PUT", {
                    message: `Add session: ${titleInput}`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(sessionsList, null, 2)))),
                    sha: fileSha
                });

                if (updateRes.ok) {
                    statusMsg.textContent = "✅ با موفقیت منتشر شد!";
                    document.getElementById("uploadForm").reset();
                    loadAdminSessions();
                } else {
                    throw new Error("خطا در ثبت لیست.");
                }

            } catch (error) {
                statusMsg.textContent = "❌ " + error.message;
            } finally {
                submitBtn.disabled = false;
            }
        }

        async function deleteSession(index) {
            if (!confirm("آیا از حذف این جلسه مطمئن هستید؟")) return;

            try {
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;
                const res = await callGitHubAPI(apiUrl, "GET");
                if (!res.ok) throw new Error("خطا در خواندن اطلاعات.");

                const data = await res.json();
                let sessionsList = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                
                sessionsList.splice(index, 1);

                const updateRes = await callGitHubAPI(apiUrl, "PUT", {
                    message: "Delete session",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(sessionsList, null, 2)))),
                    sha: data.sha
                });

                if (updateRes.ok) {
                    alert("جلسه حذف شد.");
                    loadAdminSessions();
                } else {
                    throw new Error("خطا در ذخیره تغییرات.");
                }
            } catch (error) {
                alert("خطا: " + error.message);
            }
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
